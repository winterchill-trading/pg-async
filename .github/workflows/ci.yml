name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libpq-dev builds the bindings; the server binaries (initdb, pg_ctl,
      # postgres) run the throwaway clusters the tests start.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev postgresql
      - uses: winterchill-trading/infra/.github/actions/ox-setup@main
      - run: opam exec -- dune build
      - run: opam exec -- dune build @examples/all
      - run: opam exec -- dune test
      # odoc does not declare result; the local switch only had it transitively.
      - run: opam install -y result odoc
      - name: Build API docs (odoc warnings fail the step)
        env:
          ODOC_WARN_ERROR: "true"
        run: |
          set -o pipefail
          opam exec -- dune build @doc --display short 2>&1 | tee doc.log
          if grep -q "Warning" doc.log; then exit 1; fi
  obj-magic:
    uses: winterchill-trading/infra/.github/workflows/obj-magic.yml@main
